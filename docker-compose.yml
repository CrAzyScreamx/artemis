# ARTEMIS console, Portainer-ready: pulls the image built by
# .github/workflows/docker.yml, no local build.
#
# Connect the phone from the UI: open http://<host>:8080, go to the device
# panel, enter the phone's Wi-Fi IP + Wireless debugging port, click Connect.
# The container runs its own adb, so no ADB config is needed here.
#
# One-time pairing on Android 11+ (Portainer > container > Console):
#   adb pair <PHONE_IP>:<pairing-port> <code>
#
# The console has no auth: keep port 8080 on a trusted network (LAN/Tailscale).
services:
  artemis:
    image: ghcr.io/crazyscreamx/artemis:latest
    container_name: artemis
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      # ponytail: CORS/origin guard still blocks ADB *server* settings from remote browsers; wireless connect itself is ungated.
      - ARTEMIS_ALLOW_REMOTE_ADB_CONFIGURATION=true
    volumes:
      - artemis-traces:/app/traces
    healthcheck:
      test: ["CMD", "curl", "-sf", "-m", "2", "-o", "/dev/null", "http://localhost:8080/api/system/server-status"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  artemis-traces:
